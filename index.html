<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识站 · 学习索引</title>
<meta name="description" content="知识讲解类 HTML 项目索引，AI 收集整理后生成的可视化学习页面。">
<style>
/* ============================================================
   设计令牌 —— 自然风格：奶油白底 / 鼠尾草绿 / 赤陶橙 / 树皮棕
   ============================================================ */
:root{
  --cream:#f5f0e6;
  --cream-2:#ede6d6;
  --cream-3:#e4dcc9;
  --sage:#8a9a5b;
  --sage-dark:#6b7a45;
  --sage-soft:#a8b37e;
  --terracotta:#c97b4a;
  --terracotta-dark:#a8622f;
  --bark:#4a3b2a;
  --bark-2:#5c4a38;
  --muted:#8a7d6b;
  --line:rgba(74,59,42,.12);
  --line-2:rgba(74,59,42,.22);

  --shadow-1:0 1px 2px rgba(74,59,42,.06);
  --shadow-2:0 8px 24px -10px rgba(74,59,42,.28);
  --shadow-3:0 20px 50px -24px rgba(74,59,42,.35);

  --radius:14px;
  --radius-sm:9px;
  --radius-xs:6px;

  --font-body:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-display:"Georgia","Noto Serif SC","PingFang SC",serif;

  --titlebar-h:44px;
  --sidebar-w:72px;
}

*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;height:100%;}
body{
  margin:0;background:var(--cream);color:var(--bark);
  font-family:var(--font-body);font-size:15px;line-height:1.75;
  -webkit-font-smoothing:antialiased;
  height:100%;overflow:hidden;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
ul,ol{margin:0;padding:0;}
li{list-style:none;}
h1,h2,h3,h4{margin:0;font-weight:650;line-height:1.3;}
p{margin:0;}
::selection{background:rgba(138,154,91,.3);}

/* 滚动条 */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:padding-box;}

/* ============================================================
   布局骨架
   ============================================================ */
.app{
  display:flex;flex-direction:column;
  height:100%;
}

/* 标题栏（桌面窗口风格） */
.titlebar{
  height:var(--titlebar-h);
  flex-shrink:0;
  display:flex;align-items:center;
  padding:0 16px;
  background:var(--cream-2);
  border-bottom:1px solid var(--line);
  user-select:none;
}
.traffic{display:flex;gap:8px;}
.traffic i{
  width:12px;height:12px;border-radius:50%;
  display:block;
}
.traffic i:nth-child(1){background:#e07b6b;}
.traffic i:nth-child(2){background:#e0b96b;}
.traffic i:nth-child(3){background:#8aa66b;}
.tbar-title{
  flex:1;text-align:center;
  font-size:13px;color:var(--muted);letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.tbar-title .leaf{color:var(--sage);}
.tbar-meta{font-size:12px;color:var(--muted);min-width:80px;text-align:right;}

/* 主体区 */
.body{
  flex:1;display:flex;min-height:0;
}

/* 图标侧栏（VS Code / Discord 风格） */
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--cream-2);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;
  padding:14px 0;
  gap:10px;
}
.side-logo{
  width:42px;height:42px;border-radius:12px;
  background:var(--sage);color:#fff;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:8px;
  box-shadow:0 4px 12px -4px rgba(107,122,69,.5);
}
.side-logo svg{width:22px;height:22px;}
.side-divider{
  width:28px;height:1px;background:var(--line-2);margin:4px 0;
}
.side-item{
  position:relative;
  width:48px;height:48px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);
  transition:all .2s ease;
}
.side-item svg{width:22px;height:22px;}
.side-item:hover{background:var(--cream-3);color:var(--bark);}
.side-item.active{
  background:var(--sage);color:#fff;
  box-shadow:0 4px 12px -4px rgba(107,122,69,.55);
}
.side-item.active::before{
  content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:3px;height:22px;border-radius:0 3px 3px 0;
  background:var(--terracotta);
}
.side-item .tip{
  position:absolute;left:60px;top:50%;transform:translateY(-50%);
  background:var(--bark);color:#fff;
  padding:5px 10px;border-radius:6px;font-size:12px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .15s ease;
  z-index:10;
}
.side-item:hover .tip{opacity:1;}

/* 内容区 */
.content{
  flex:1;overflow-y:auto;
  scroll-behavior:smooth;
  background:
    radial-gradient(900px 400px at 85% -10%,rgba(138,154,91,.12),transparent 60%),
    radial-gradient(700px 380px at -5% 110%,rgba(201,123,74,.10),transparent 60%),
    var(--cream);
}
.content-inner{
  max-width:960px;margin:0 auto;
  padding:48px 40px 80px;
}

/* ============================================================
   顶部说明
   ============================================================ */
.page-head{margin-bottom:36px;}
.page-eyebrow{
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--sage-dark);font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.page-eyebrow::before{
  content:"";width:24px;height:2px;background:var(--terracotta);border-radius:2px;
}
.page-title{
  font-family:var(--font-display);
  font-size:38px;color:var(--bark);margin-top:14px;
  letter-spacing:-.01em;
}
.page-title em{
  font-style:normal;color:var(--sage-dark);
}
.page-sub{
  margin-top:12px;color:var(--bark-2);font-size:15px;max-width:640px;
}
.page-sub code{
  font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  font-size:.85em;background:var(--cream-2);
  padding:2px 7px;border-radius:5px;color:var(--terracotta-dark);
}

/* ============================================================
   项目卡片网格
   ============================================================ */
.project-area{
  display:flex;flex-direction:column;gap:28px;
}
.project-card{
  background:var(--cream-2);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:32px;
  box-shadow:var(--shadow-2);
  display:grid;grid-template-columns:1fr;gap:24px;
  scroll-margin-top:20px;
  transition:box-shadow .3s ease, transform .3s ease;
}
.project-card:hover{
  box-shadow:var(--shadow-3);
}
.pc-top{display:flex;align-items:flex-start;gap:20px;}
.pc-icon{
  flex-shrink:0;width:64px;height:64px;border-radius:16px;
  background:var(--sage);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px -6px rgba(107,122,69,.6);
}
.pc-icon svg{width:32px;height:32px;}
.pc-head{flex:1;min-width:0;}
.pc-name{
  font-family:var(--font-display);
  font-size:26px;color:var(--bark);
}
.pc-tagline{
  font-size:14px;color:var(--sage-dark);font-weight:600;
  margin-top:2px;letter-spacing:.02em;
}
.pc-badge{
  margin-top:8px;display:inline-flex;align-items:center;gap:6px;
  font-size:12px;color:var(--terracotta-dark);
  background:rgba(201,123,74,.12);
  padding:4px 10px;border-radius:20px;
}
.pc-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--terracotta);}

.pc-desc{
  color:var(--bark-2);font-size:15px;line-height:1.85;
}
.pc-desc b{color:var(--bark);font-weight:600;}

.pc-tags{display:flex;flex-wrap:wrap;gap:8px;}
.pc-tags span{
  font-size:12px;color:var(--bark-2);
  background:var(--cream);
  border:1px solid var(--line-2);
  padding:4px 12px;border-radius:20px;
}
.pc-tags span.feat{
  color:var(--sage-dark);border-color:var(--sage-soft);
  background:rgba(138,154,91,.1);
}

.pc-foot{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:20px;border-top:1px dashed var(--line-2);
}
.pc-meta{display:flex;gap:18px;font-size:13px;color:var(--muted);}
.pc-meta b{color:var(--bark);font-weight:600;margin-left:4px;}
.pc-enter{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--terracotta);color:#fff;
  padding:11px 22px;border-radius:10px;
  font-size:14px;font-weight:600;
  box-shadow:0 4px 14px -4px rgba(168,98,47,.5);
  transition:all .2s ease;
}
.pc-enter:hover{
  background:var(--terracotta-dark);
  transform:translateY(-1px);
  box-shadow:0 6px 18px -4px rgba(168,98,47,.55);
}
.pc-enter svg{width:16px;height:16px;}

/* 占位提示 */
.empty-note{
  text-align:center;padding:60px 20px;color:var(--muted);
  border:2px dashed var(--line-2);border-radius:var(--radius);
  background:rgba(255,255,255,.3);
}

/* 底部说明 */
.site-foot{
  margin-top:44px;padding-top:24px;
  border-top:1px solid var(--line);
  font-size:13px;color:var(--muted);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
}
.site-foot .ai-note{display:flex;align-items:center;gap:8px;}
.site-foot .ai-note svg{width:16px;height:16px;color:var(--sage);}

/* 动画 */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.project-card{animation:fadeUp .5s ease both;}
.project-card .pc-tags span{animation:fadeUp .4s ease both;}
.project-card .pc-tags span:nth-child(2){animation-delay:.05s;}
.project-card .pc-tags span:nth-child(3){animation-delay:.1s;}
.project-card .pc-tags span:nth-child(4){animation-delay:.15s;}
.project-card .pc-tags span:nth-child(5){animation-delay:.2s;}
.project-card .pc-tags span:nth-child(6){animation-delay:.25s;}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}

/* 响应式 */
@media (max-width:680px){
  .page-title{font-size:28px;}
  .content-inner{padding:28px 20px 60px;}
  .pc-top{flex-direction:column;}
  .pc-foot{flex-direction:column;align-items:flex-start;gap:16px;}
  .tbar-meta{display:none;}
}
</style>
</head>
<body>

<div class="app">

  <!-- 桌面窗口标题栏 -->
  <header class="titlebar">
    <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="tbar-title">
      <span class="leaf">🌿</span>
      <span>知识站 · 学习索引</span>
    </div>
    <div class="tbar-meta" id="tbarMeta">— 个项目</div>
  </header>

  <div class="body">

    <!-- 图标侧栏 -->
    <aside class="sidebar">
      <div class="side-logo" title="知识站">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <div class="side-divider"></div>
      <nav id="sideNav" class="side-nav" aria-label="项目列表"></nav>
    </aside>

    <!-- 内容区 -->
    <main class="content">
      <div class="content-inner">

        <div class="page-head">
          <div class="page-eyebrow">Knowledge Index</div>
          <h1 class="page-title">欢迎来到 <em>知识站</em></h1>
          <p class="page-sub">这里收录了一系列可视化学习页面，内容经 AI 收集、整理后生成。选择左侧项目，点击「进入学习」即可开始。例如 <code>PacketFlow</code> 就是通过 AI 制作的计算机网络可视化学习平台。</p>
        </div>

        <section id="projectArea" class="project-area"></section>

        <footer class="site-foot">
          <div class="ai-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
              <circle cx="12" cy="12" r="4"/>
            </svg>
            <span>内容由 AI 收集整理后生成</span>
          </div>
          <div>Endless HTML · 持续收录中</div>
        </footer>

      </div>
    </main>

  </div>
</div>

<script>
/* ============================================================
   项目数据 —— 新增项目只需在此数组中添加一项
   ============================================================ */
const PROJECTS = [
  {
    id: "packetflow",
    name: "PacketFlow",
    tagline: "计算机网络 · 可视化学习平台",
    description: '用 <b>动画</b>、<b>Canvas</b> 与 <b>可交互模型</b>，系统学习计算机网络七个阶段：分层模型、物理层与链路层、IP 编址、传输层、应用层、网络设备与拓扑、网络安全。把抽象协议变成看得见的过程。',
    path: "PacketFlow/index.html",
    icon: "network",
    stages: 7,
    tags: ["计算机网络", "可视化", "交互式", "动画", "Canvas"],
    features: ["7 阶段完整路径", "可交互模型", "自测进度"]
  },
  {
    id: "ai-ops-atlas",
    name: "AI Ops Atlas",
    tagline: "算力控制台 · AI 运维工程师 16 周学习图谱",
    description: '把 7 份 AI 运维学习笔记重构为 <b>可交互、可练习、可检索</b> 的学习站点。覆盖认知与环境、Linux 与 Shell、服务器硬件与 GPU、网络与高速互联、容器与 Kubernetes、自动化运维与监控、AI 集群实战与求职冲刺，共 7 阶段、198 章节、21 个交互可视化。',
    path: "ai-ops-atlas/index.html",
    icon: "cpu",
    stages: 7,
    tags: ["AI 运维", "Kubernetes", "GPU", "Linux", "监控告警"],
    features: ["21 个交互可视化", "命令面板检索", "日/夜双主题"]
  },
  {
    id: "security-learning-hub",
    name: "SEC · ATLAS",
    tagline: "网络安全 L1–L6 交互式学习图谱",
    description: '基于阶段一~五技术笔记的交互式学习图谱，共 <b>72 章</b>、<b>70 个原理动画</b>。覆盖六大层级：计算机基础（TCP/DNS/TLS/权限模型/HTTP）、安全核心（CIA/威胁建模/CVSS/密码学/零信任/SDL/ATT&CK）、防御基础（基线加固/防火墙/IDS-WAF/SIEM/EDR）、渗透测试（OWASP Top 10/注入/XSS/SSRF/域渗透）、专项方向（恶意代码分析/逆向/云安全/工控 OT）、应急响应与取证（NIST/内存取证/威胁狩猎/检测工程）。',
    path: "security-learning-hub/index.html",
    icon: "shield",
    stages: 6,
    tags: ["网络安全", "渗透测试", "应急响应", "取证", "ATT&CK"],
    features: ["70 个原理动画", "L1–L6 六阶路径", "日/夜双主题"]
  }
];

/* 图标库 */
const ICONS = {
  network: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="16" y="16" width="6" height="6" rx="1"/><path d="M12 8v4M12 12H5v4M12 12h7v4"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  arrowRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
  cpu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg>',
  code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
  sparkles: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 10l-5.8 1.9L12 18l-1.9-6.1L4 10l6.1-1.2L12 3z"/></svg>'
};

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* 渲染侧栏 —— 锚点跳转 */
function renderSideNav(){
  const nav = document.getElementById("sideNav");
  nav.innerHTML = PROJECTS.map(function(p){
    return '<a class="side-item" href="#project-' + p.id + '" data-id="' + p.id + '" aria-label="' + esc(p.name) + '" title="' + esc(p.name) + '">' +
      (ICONS[p.icon] || ICONS.book) +
      '<span class="tip">' + esc(p.name) + ' · ' + esc(p.tagline) + '</span>' +
      '</a>';
  }).join("");
}

/* 渲染单个项目卡片 */
function cardHTML(p){
  const feats = (p.features || []).map(function(f){ return '<span class="feat">✓ ' + esc(f) + '</span>'; }).join("");
  const tags = (p.tags || []).map(function(t){ return '<span>' + esc(t) + '</span>'; }).join("");
  const stages = p.stages ? '<span>阶段<b>' + p.stages + '</b></span>' : '';

  return '<article class="project-card" id="project-' + p.id + '">' +
      '<div class="pc-top">' +
        '<div class="pc-icon">' + (ICONS[p.icon] || ICONS.book) + '</div>' +
        '<div class="pc-head">' +
          '<h2 class="pc-name">' + esc(p.name) + '</h2>' +
          '<div class="pc-tagline">' + esc(p.tagline) + '</div>' +
          '<span class="pc-badge"><span class="dot"></span>已收录</span>' +
        '</div>' +
      '</div>' +
      '<p class="pc-desc">' + p.description + '</p>' +
      '<div class="pc-tags">' + tags + feats + '</div>' +
      '<div class="pc-foot">' +
        '<div class="pc-meta">' +
          stages +
          '<span>类型<b>可视化学习</b></span>' +
        '</div>' +
        '<a class="pc-enter" href="' + esc(p.path) + '">' +
          '进入学习' + ICONS.arrowRight +
        '</a>' +
      '</div>' +
    '</article>';
}

/* 渲染全部项目卡片 */
function renderAllProjects(){
  const area = document.getElementById("projectArea");
  if(!PROJECTS.length){
    area.innerHTML = '<div class="empty-note">暂无项目，敬请期待。</div>';
    return;
  }
  area.innerHTML = PROJECTS.map(cardHTML).join("");
}

/* 滚动高亮 —— IntersectionObserver 监听卡片可见性 */
function initScrollSpy(){
  const items = document.querySelectorAll(".side-item");
  const cards = document.querySelectorAll(".project-card");
  if(!items.length || !cards.length) return;

  const idToItem = {};
  items.forEach(function(it){ idToItem[it.dataset.id] = it; });

  const observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        const id = entry.target.id.replace("project-", "");
        items.forEach(function(it){ it.classList.remove("active"); });
        if(idToItem[id]) idToItem[id].classList.add("active");
      }
    });
  }, {
    root: document.querySelector(".content"),
    rootMargin: "-30% 0px -55% 0px",
    threshold: 0
  });

  cards.forEach(function(c){ observer.observe(c); });
}

/* 初始化 */
function init(){
  document.getElementById("tbarMeta").textContent = PROJECTS.length + " 个项目";
  renderSideNav();
  renderAllProjects();
  initScrollSpy();
}
init();
</script>
